name: UpsideOnly Leaderboard Monitor

on:
  schedule:
    - cron: '*/30 * * * *'   # Every 30 minutes, 24/7
  workflow_dispatch:           # Manual trigger anytime

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Restore leaderboard state
        uses: actions/cache@v4
        with:
          path: leaderboard_state.json
          key: leaderboard-state-${{ github.run_id }}
          restore-keys: leaderboard-state-

      - name: Run leaderboard monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python leaderboard_monitor.py

      - name: Save leaderboard state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: leaderboard_state.json
          key: leaderboard-state-${{ github.run_id }}
