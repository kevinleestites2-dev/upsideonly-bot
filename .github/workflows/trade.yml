name: UpsideOnly Bot — Trade Cycle

on:
  schedule:
    - cron: "*/30 * * * *"   # Every 30 minutes
  workflow_dispatch:          # Manual trigger

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright requests pandas numpy yfinance
          playwright install chromium
          playwright install-deps chromium

      - name: Write session cookies
        env:
          COOKIES_JSON: ${{ secrets.COOKIES_JSON }}
        run: echo "$COOKIES_JSON" > cookies.json

      - name: Run trade cycle
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python cloud_executor.py
