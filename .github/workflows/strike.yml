name: UpsideOnly Strike Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'   # fallback restart every 5 hours if chain breaks

permissions:
  actions: write

jobs:
  strike:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run Strike Bot
        run: python3 upsideonly_bot.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Self-restart
        if: always()
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/strike.yml/dispatches" \
            -d '{"ref":"main"}'
